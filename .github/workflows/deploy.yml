# Builds the web playground and deploys to GitHub Pages.
#
# Prerequisites (one-time repo setup):
#   Settings → Pages → Source → GitHub Actions
#
# COOP/COEP note:
#   GitHub Pages doesn't support custom response headers, so the dev-server
#   COOP/COEP headers in vite.web.config.ts are dev-only. DuckDB Wasm's
#   selectBundle() auto-detects the missing headers and falls back to the
#   single-threaded MVP bundle — the playground still works.
#
#   To enable the faster multi-threaded bundle on Pages, add coi-serviceworker:
#     cd frontend && npm i -D coi-serviceworker
#     cp node_modules/coi-serviceworker/coi-serviceworker.js public/
#   Then add to index.html <head>:
#     <script src="/coi-serviceworker.js"></script>

name: Deploy Web Playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build web playground
        working-directory: frontend
        run: npm run build:web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist-web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
