# Builds the landing page (Astro) + web playground (Vite/DuckDB Wasm)
# and deploys them together to GitHub Pages.
#
#   /          → landing page  (website/)
#   /sandbox/  → Wasm playground (frontend/)
#   /docs/     → VitePress docs (future)
#
# Prerequisites (one-time repo setup):
#   Settings → Pages → Source → GitHub Actions
#
# COOP/COEP note:
#   GitHub Pages doesn't support custom response headers, so the dev-server
#   COOP/COEP headers in vite.web.config.ts are dev-only. DuckDB Wasm's
#   selectBundle() auto-detects the missing headers and falls back to the
#   single-threaded MVP bundle — the playground still works.

name: Deploy to GitHub Pages

on:
  push:
    branches: [main, wails]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # ── Landing page ──────────────────────────────────────────
      - name: Install website deps
        working-directory: website
        run: npm install
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      - name: Build landing page
        working-directory: website
        run: npm run build
        env:
          ASTRO_TELEMETRY_DISABLED: '1'

      # ── Wasm playground ───────────────────────────────────────
      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build web playground
        working-directory: frontend
        run: npm run build:web

      # ── Docs ─────────────────────────────────────────────────
      - name: Install docs deps
        working-directory: docs
        run: npm install

      - name: Build docs
        working-directory: docs
        run: npm run build

      # ── Combine into one artifact ─────────────────────────────
      # website/dist               → root      (sql.garden/)
      # frontend/dist-web          → /sandbox/ (sql.garden/sandbox/)
      # docs/.vitepress/dist       → /docs/    (sql.garden/docs/)
      - name: Assemble Pages artifact
        run: |
          mkdir -p dist-pages/sandbox
          mkdir -p dist-pages/docs
          cp -r website/dist/. dist-pages/
          cp -r frontend/dist-web/. dist-pages/sandbox/
          cp -r docs/.vitepress/dist/. dist-pages/docs/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist-pages

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
